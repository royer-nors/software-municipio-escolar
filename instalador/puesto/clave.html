<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
    <title>Autorización</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 22px; background: #edf3fa; color: #17324d; font-family: Arial, sans-serif; }
      main { width: min(440px, 100%); padding: 30px; border-radius: 14px; background: white; box-shadow: 0 10px 35px #17324d33; }
      h1 { margin-top: 0; color: #073b78; font-size: 25px; }
      label { display: block; margin: 22px 0 8px; font-weight: 700; }
      input { width: 100%; padding: 12px; border: 1px solid #a8bed8; border-radius: 7px; font-size: 18px; }
      button { margin: 16px 8px 0 0; padding: 11px 15px; border: 0; border-radius: 7px; background: #0759b8; color: white; font-weight: 700; cursor: pointer; }
      button[type="button"] { background: #e8eff8; color: #17324d; }
      [role="alert"] { min-height: 1.5em; color: #9b1c1c; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="titulo">Autorizar acción</h1>
      <p id="descripcion">Escribe la clave definida al configurar el puesto.</p>
      <form id="formulario">
        <label for="clave">Clave</label>
        <input id="clave" type="password" autocomplete="current-password" required autofocus>
        <p id="error" role="alert" aria-live="polite"></p>
        <button type="submit">Continuar</button>
        <button id="cancelar" type="button">Cancelar</button>
      </form>
    </main>
    <script src="clave.cjs"></script>
  </body>
</html>
